<!doctype html>
<!-- Automated checks for Web/editor.js. Run with tests/run-tests.ps1 (headless Chrome), or open in Chrome
     directly (needs --allow-file-access-from-files for nothing; it only loads ../Web/editor.js). -->
<html><head><meta charset="utf-8"><title>Theme Builder tests</title></head>
<body style="background:#111;color:#ddd;font-family:monospace">
<pre id="out"></pre>
<script>
    const out = document.getElementById('out');
    let passed = 0, failed = 0;
    const log = (m) => { out.textContent += m + '\n'; };
    const check = (name, ok, detail) => {
        if (ok) passed++; else failed++;
        log((ok ? 'PASS ' : 'FAIL ') + name + (detail !== undefined && !ok ? '  -> ' + detail : ''));
    };
    window.onerror = (m, s, l, c) => { failed++; log('FAIL uncaught error: ' + m + ' @' + l + ':' + c); };

    // Minimal stand-ins for the Jellyfin web client globals editor.js uses.
    window.__TB_TEST__ = true;
    const savedSettings = { AccentColor: '#e50914', EnableOledBlack: true, HideAlphaPicker: true };
    window.ApiClient = {
        getCurrentUserId: () => 'u1',
        getCurrentUser: () => Promise.resolve({ Policy: { IsAdministrator: true } }),
        getUrl: (p) => p,
        getPluginConfiguration: () => Promise.resolve({ SettingsJson: JSON.stringify(savedSettings), PreviousSettingsJson: JSON.stringify({ AccentColor: '#123456' }), CssVersion: 'old', GeneratedCss: '' }),
        updatePluginConfiguration: () => Promise.resolve(),
        getNamedConfiguration: () => Promise.resolve({ CustomCss: '' }),
        updateNamedConfiguration: () => Promise.resolve()
    };
    window.Dashboard = { showLoadingMsg() {}, hideLoadingMsg() {}, alert() {} };
</script>
<script src="../Web/editor.js"></script>
<script src="fixtures/jellyfin-web-10.10-focus.js"></script>
<script>
(async function () {
    const T = window.__ThemeBuilderTest;
    check('editor.js loads and exposes test hooks', !!T);
    if (!T) { log('RESULT: ' + passed + ' passed, ' + failed + ' failed'); return; }
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const fire = (el, type) => el.dispatchEvent(new Event(type || 'input'));

    // ---- CSS generation ----
    const parse = (css) => { const st = new CSSStyleSheet(); st.replaceSync(css.replace(/@import[^;]*;/g, '')); return [...st.cssRules].map(r => r.cssText).join('\n'); };
    const defaults = T.defaultValues();
    check('field ids are unique', new Set(T.fields.filter(f => f.id).map(f => f.id)).size === T.fields.filter(f => f.id).length);
    check('every field has a default', T.fields.filter(f => f.id).every(f => f.default !== undefined));
    let css = T.buildCss(defaults);
    check('default theme builds', css.length > 1000, css.length);
    check('default theme never paints .backgroundContainer solid (black detail pages)', !/\.backgroundContainer(?!\.withBackdrop)[^{]*\{[^}]*background(-color)?:(?!\s*transparent)/.test(css.replace(/\/\*[\s\S]*?\*\//g, '')));

    // Older clients (TV apps) paint .backgroundContainer #101010 over <html>; it must turn see-through, backdrop dimming kept.
    (() => {
        const st = document.createElement('style');
        st.textContent = '.backgroundContainer { background-color: #101010; } .backgroundContainer.withBackdrop { background-color: rgba(0, 0, 0, 0.86); }\n' + T.buildCss(T.defaultValues());
        const host = document.createElement('div');
        host.innerHTML = '<div class="backgroundContainer"></div><div class="backgroundContainer withBackdrop"></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        const [plainBg, withBd] = [...host.children].map(d => getComputedStyle(d).backgroundColor);
        check('TV: page background is not hidden by the old #101010 layer', plainBg === 'rgba(0, 0, 0, 0)', plainBg);
        check('backdrop dimming layer untouched', withBd === 'rgba(0, 0, 0, 0.86)', withBd);
        st.remove(); host.remove();
    })();

    // Tick boxes and dialog headers (upload dialogs etc.) with a light accent, frosted glass and night mode.
    (() => {
        const st = document.createElement('style');
        const base = '.checkboxIcon { color: #fff; } .formDialogHeader { background-color: #202020; }\n';
        const host = document.createElement('div');
        host.innerHTML = '<label><input type="checkbox" class="emby-checkbox" checked><span>x</span><span class="checkboxOutline"><span class="material-icons checkboxIcon checkboxIcon-checked">check</span></span></label>'
            + '<div class="dialog"><div class="formDialogHeader">Upload</div><div class="formDialogFooter">f</div></div>';
        document.body.appendChild(host); document.head.appendChild(st);
        st.textContent = base + T.buildCss(Object.assign(T.defaultValues(), { AccentColor: '#f5f5f7', SurfaceColor: '#222233' }));
        const icon = getComputedStyle(host.querySelector('.checkboxIcon')).color;
        check('tick stays visible on a light accent (dark tick)', icon === 'rgb(0, 0, 0)', icon);
        const hdr = getComputedStyle(host.querySelector('.formDialogHeader')).backgroundColor;
        check('dialog header follows the Menus colour', hdr === 'rgb(34, 34, 51)', hdr);
        st.textContent = base + T.buildCss(Object.assign(T.defaultValues(), { GlassMenus: true }));
        const gh = getComputedStyle(host.querySelector('.formDialogHeader')).backgroundColor, gf = getComputedStyle(host.querySelector('.formDialogFooter')).backgroundColor;
        check('frosted glass: dialog header and footer show the glass', gh === 'rgba(0, 0, 0, 0)' && gf === 'rgba(0, 0, 0, 0)', gh + ' / ' + gf);
        st.textContent = base + T.buildCss(Object.assign(T.defaultValues(), { NightMode: true, NightOled: true, GlassMenus: true }));
        document.documentElement.classList.add('tb-night');
        const nh = getComputedStyle(host.querySelector('.formDialogHeader')).backgroundColor;
        document.documentElement.classList.remove('tb-night');
        check('night true black: dialog header goes black too', nh === 'rgb(0, 0, 0)', nh);
        st.remove(); host.remove();
    })();

    // Text Size scales each layout's own base size instead of forcing the desktop one onto TV and phones.
    (() => {
        const c = T.buildCss(Object.assign(T.defaultValues(), { TextScale: '120' }));
        check('Text Size keeps TV at 125% (x scale)', c.indexOf('html.layout-tv { font-size: 150.00% !important; }') !== -1 && c.indexOf('html { font-size: 111.60% !important; }') !== -1);
        check('Text Size keeps phones at 90% (x scale)', c.indexOf('html.layout-mobile { font-size: 108.00% !important; }') !== -1);
        check('Text Size 100% leaves every layout alone', !/html(\.layout-\w+)? \{ font-size/.test(T.buildCss(T.defaultValues())));
    })();

    // TV grids: breakpoints scaled for TV's larger text, so grid posters match row posters.
    (() => {
        const c = T.buildCss(Object.assign(T.defaultValues(), { PosterSize: 'large' }));
        const first = (14 * 3 * 1.25 / 0.93).toFixed(2);
        check('TV grid breakpoints use TV text size', c.indexOf(`@media (min-width: ${first}em) { .layout-tv .vertical-wrap > .portraitCard`) !== -1, first);
        check('desktop grid breakpoints unchanged', c.indexOf('@media (min-width: 42em) { .vertical-wrap > .portraitCard') !== -1);
    })();

    // TV focus frame: card shadow stays on the image; detail buttons keep a solid focus.
    (() => {
        const st = document.createElement('style');
        st.textContent = '.card.show-focus:not(.show-animation) .cardBox:not(.visualCardBox) .cardScalable { border: 0.5em solid transparent; }\n'
            + T.buildCss(Object.assign(T.defaultValues(), { EnableCardShadow: true, AccentColor: '#e50914' }));
        const host = document.createElement('div');
        host.style.fontSize = '10px';
        host.innerHTML = '<div class="card show-focus"><div class="cardBox"><div class="cardScalable"></div></div></div><div class="card"><div class="cardBox"><div class="cardScalable"></div></div></div>'
            + '<div class="itemDetailPage"><div class="mainDetailButtons"><button class="detailButton emby-button show-focus"><span class="material-icons"></span></button><button class="detailButton emby-button"><span class="material-icons"></span></button></div></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        const [tvS, deskS] = [...host.querySelectorAll('.cardScalable')].map(e => getComputedStyle(e).boxShadow);
        check('TV card shadow hugs the image (spread -0.5em)', /-5px/.test(tvS) && !/-5px/.test(deskS), tvS + ' | ' + deskS);
        const [tvBtn, deskBtn] = host.querySelectorAll('.detailButton');
        tvBtn.focus();
        const f = getComputedStyle(tvBtn).backgroundColor, fi = getComputedStyle(tvBtn.querySelector('.material-icons')).color;
        check('TV focused detail button is solid accent with readable icon', f === 'rgb(229, 9, 20)' && fi === 'rgb(255, 255, 255)', f + ' / ' + fi);
        deskBtn.focus();
        check('desktop focused detail button keeps the light tint', getComputedStyle(deskBtn).backgroundColor === 'rgba(229, 9, 20, 0.18)', getComputedStyle(deskBtn).backgroundColor);
        st.remove(); host.remove();
    })();

    Object.keys(T.PRESETS).forEach(name => {
        let ok = true, err;
        try { parse(T.buildCss(Object.assign(T.defaultValues(), T.PRESETS[name]))); } catch (e) { ok = false; err = e.message; }
        check('preset builds: ' + name, ok, err);
    });
    const grouped = [].concat(...T.PRESET_GROUPS.map(g => g[1]));
    check('every preset is in exactly one dropdown group', grouped.length === Object.keys(T.PRESETS).length && Object.keys(T.PRESETS).every(k => grouped.filter(n => n === k).length === 1), grouped.join(', '));

    // Everything switched on / off its default: every rule the browser keeps is listed below.
    const all = T.defaultValues();
    T.fields.filter(f => f.id).forEach(f => {
        if (f.type === 'checkbox') all[f.id] = true;
        else if (f.type === 'range') all[f.id] = f.max;
        else if (f.type === 'select') all[f.id] = f.options[f.options.length - 1][0];
        else if (f.type === 'text') all[f.id] = f.id.indexOf('Url') !== -1 ? 'https://example.com/a.jpg' : 'Welcome "home"';
    });
    all.LinkWatchedToAccent = false; all.AutoBadgeText = false;
    const kept = parse(T.buildCss(all));
    [
        ['A–Z picker (new layout)', '.alphaPicker-fixed-right'], ['Play All (MUI)', 'PlayArrowIcon'], ['watched dimming', ':has(.playedIndicator)'],
        ['subtitles (native)', 'video::cue'], ['header icons', 'GroupsIcon'], ['transparent header', 'tb-scrolled'],
        ['card border', 'cardScalable::before'], ['wide tiles', 'backdropCard'], ['skip button', '.skip-button'],
        ['audio languages', 'mediaInfoItem-audioLanguage'], ['age rating', 'mediaInfoOfficialRating'], ['spinner', 'mdl-spinner__layer'],
        ['glass menus', 'backdrop-filter: blur(16px)'], ['app background', 'example.com/a.jpg'], ['episode overview', 'listItem-overview'],
        ['episode thumbs', 'listItemImage-large'], ['login logo', 'padded-bottom-page::before'], ['login welcome text', 'Welcome \\"home\\"'],
        ['forgot password', 'btnForgotPassword'], ['login blur', 'blur(20px)'], ['night dim', 'tb-night::after'], ['card titles two lines', '-webkit-line-clamp: 2'],
        ['profile icon', 'MuiAvatar-colorDefault'], ['my media titles', 'data-type="UserView"'],         ['home row title size', 'homeSectionsContainer'], ['details poster no hover', 'detailImageContainer'], ['detail sections', '#castCollapsible'], ['TV focus ring colour', '.card:focus .cardBox:not(.visualCardBox) .cardScalable'], ['TV focused button', '.emby-button.show-focus:focus'], ['plain background on TV', 'html.layout-tv'], ['main colour variable', '--jf-palette-primary-main'], ['TV guide focus', '.programCell:focus'], ['playing-now bar', '.appfooter'], ['pop-up messages', '.toast'], ['poster size (grid)', '.vertical-wrap > .portraitCard'], ['poster size (rows)', '.overflowPortraitCard'], ['titles on hover', '.card:focus-within .cardFooter'], ['badge position', '.cardIndicators'], ['progress position', '.innerCardFooterClear'], ['row title alignment', '.homeSectionsContainer .sectionTitle-cards'], ['detail alignment', '.itemDetailPage .mainDetailButtons'], ['hidden poster gap', '.detailPagePrimaryContent'], ['centred top bar', '.MuiToolbar-root > .MuiStack-root'], ['background gradient', 'right bottom']
    ].forEach(([name, needle]) => check('rule kept by the browser: ' + name, kept.indexOf(needle) !== -1, needle));

    // Older TVs (2020–2022 Tizen/webOS, Chrome 69–85) have no :has(), :is() or inset. They drop any rule
    // using those, so drop them here too and check the TV-relevant rules survive.
    const allCss = T.buildCss(all);
    check('generated CSS avoids the inset shorthand (Chrome 87+)', !/[{;\s]inset\s*:/.test(allCss));
    const oldTv = (() => { const st = new CSSStyleSheet(); st.replaceSync(allCss.replace(/@import[^;]*;/g, ''));
        return [...st.cssRules].filter(r => !(r.selectorText && /:has\(|:is\(/.test(r.selectorText))).map(r => r.cssText).join('\n'); })();
    [
        ['TV focus ring', '.layout-tv .card:focus .cardScalable::after'], ['TV focus colour', '.card:focus .cardBox:not(.visualCardBox) .cardScalable'],
        ['Play All (classic)', '.btnPlayAll'], ['Shuffle (classic)', '.btnShuffle'], ['header search', '.headerSearchButton'],
        ['header cast', '.headerCastButton'], ['header SyncPlay', '.headerSyncButton'], ['player buttons', '.osdControls .btnPause'],
        ['home row title size', '.homeSectionsContainer .sectionTitleContainer'], ['my media titles', 'data-type="UserView"'],
        ['wide tiles', '.backdropCard .cardScalable'], ['profile icon (MUI)', 'MuiAvatar-colorDefault'], ['poster size', '.vertical-wrap > .portraitCard'], ['card title overlay', '.cardFooter'], ['centred TV header', '.skinHeader .headerLeft .pageTitle'], ['hidden poster gap', '.detailPagePrimaryContent'], ['toggle switches', 'mdl-switch__thumb'],
        ['see-through background layer', '.backgroundContainer:not(.withBackdrop)'], ['TV text size', 'html.layout-tv'], ['TV grid sizes', '.layout-tv .vertical-wrap > .portraitCard'],
        ['TV card shadow', '-0.5em'], ['TV detail button focus', '.show-focus:focus .material-icons'], ['TV floating button focus', '.layout-tv .emby-button.detailFloatingButton:focus'],
        ['multi-select bar', '.selectionCommandsPanel'], ['dialog headers', '.formDialogHeader'], ['no TV header blur', '.layout-tv .skinHeader'], ['centred TV tab strip', '.headerTabs { margin-left: auto'],
        ['profile icon (classic)', '.headerUserButton:not(.headerUserButtonRound)'], ['watched dimming', '.layout-tv .cardIndicators .playedIndicator'],
        ['version count badge', '.mediaSourceIndicator'], ['solid menus, no blur', 'html.layout-tv .mainDrawer'], ['old client poster gap', '.detailPagePrimaryContainer.padded-left']
    ].forEach(([name, needle]) => check('old TV browser keeps: ' + name, oldTv.indexOf(needle) !== -1, needle));

    // Positioning options applied to real card / detail markup.
    (() => {
        const st = document.createElement('style');
        st.textContent = T.buildCss(Object.assign(T.defaultValues(), { PosterSize: 'large', CardTitlePosition: 'overlay', BadgePosition: 'topLeft', DetailPosterSide: 'right' }));
        const host = document.createElement('div');
        host.innerHTML = '<div class="overflowPortraitCard card" style="font-size:10px"><div class="cardBox"><div class="cardScalable"><div class="cardIndicators"></div></div><div class="cardFooter"><div class="cardText">T</div></div></div></div>'
            + '<div class="itemDetailPage"><div class="detailPagePrimaryContent"></div></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        document.documentElement.classList.add('layout-desktop');
        const card = host.querySelector('.card');
        check('poster size sets the row card width', getComputedStyle(card).width === '140px', getComputedStyle(card).width);
        check('card titles can sit on the poster', getComputedStyle(card.querySelector('.cardFooter')).position === 'absolute');
        check('watched badge can move to the top left', getComputedStyle(card.querySelector('.cardIndicators')).right === 'auto');
        const pad = getComputedStyle(host.querySelector('.detailPagePrimaryContent'));
        check('poster on the right moves the text space to the left', parseFloat(pad.paddingRight) > parseFloat(pad.paddingLeft), pad.paddingLeft + ' / ' + pad.paddingRight);
        document.documentElement.classList.remove('layout-desktop');
        st.remove(); host.remove();
    })();

    // Hidden poster on the older client TV apps bundle (10.10): it pads different containers than the server's client.
    (() => {
        const st = document.createElement('style');
        st.textContent = '.layout-tv [dir="ltr"] .detailPagePrimaryContainer, [dir="ltr"] .detailPageContent { padding-left: 32.45vw; } .padded-right { padding-right: 3.3%; }\n'
            + T.buildCss(Object.assign(T.defaultValues(), { HideDetailPoster: true }));
        const host = document.createElement('div');
        host.setAttribute('dir', 'ltr');
        host.style.width = '1000px';
        host.innerHTML = '<div class="itemDetailPage"><div class="detailPageWrapperContainer"><div class="detailPagePrimaryContainer padded-left padded-right"></div>'
            + '<div class="detailPageSecondaryContainer"><div class="detailPageContent"><div class="detailPagePrimaryContent padded-right"></div></div></div></div></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        document.documentElement.classList.add('layout-tv');
        const left = (s) => parseFloat(getComputedStyle(host.querySelector(s)).paddingLeft);
        const inner = host.querySelector('.detailPagePrimaryContent').getBoundingClientRect().left - host.getBoundingClientRect().left;
        check('TV (10.10): hidden poster frees the title area', left('.detailPagePrimaryContainer') < 50, left('.detailPagePrimaryContainer'));
        check('TV (10.10): hidden poster frees the overview and rows', inner > 0 && inner < 50, inner);
        document.documentElement.classList.remove('layout-tv');
        st.remove(); host.remove();
    })();

    // Classic header profile button: accent only on the plain person icon, never behind a user picture.
    (() => {
        const st = document.createElement('style');
        st.textContent = T.buildCss(Object.assign(T.defaultValues(), { AccentColor: '#e50914', AccentProfileIcon: true }));
        const host = document.createElement('div');
        host.innerHTML = '<div class="skinHeader"><button class="headerButton headerUserButton"><span class="material-icons person"></span></button>'
            + '<button class="headerButton headerUserButton headerUserButtonRound"><div class="headerUserButtonRound" style="background-image:url(x.png)"></div></button></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        const [plain, pic] = host.querySelectorAll('button');
        check('profile icon without a picture gets the accent (TV header)', getComputedStyle(plain).backgroundColor === 'rgb(229, 9, 20)', getComputedStyle(plain).backgroundColor);
        check('profile picture gets no accent behind it', getComputedStyle(pic).backgroundColor !== 'rgb(229, 9, 20)', getComputedStyle(pic).backgroundColor);
        st.remove(); host.remove();
    })();

    // The web client clips each card to its box (contain: paint). Posters start at the card's left edge in rows, so with
    // a shadow, glow or zoom the clipping has to go, or those are cut off on the left.
    (() => {
        const host = document.createElement('div');
        host.innerHTML = '<div class="itemsContainer" dir="ltr"><div class="card"><div class="cardBox"><div class="cardScalable"></div></div></div></div>';
        document.body.appendChild(host);
        const containWith = (o) => { const st = document.createElement('style'); st.textContent = '.card:not(.show-animation) { contain: layout style paint; }\n' + T.buildCss(Object.assign(T.defaultValues(), o)); document.head.appendChild(st);
            const c = getComputedStyle(host.querySelector('.card')).contain; st.remove(); return c === 'content' || c === 'strict' ? c + ' paint' : c; };  // Chrome reports 'layout style paint' as 'content'
        check('hover glow: cards not clipped to their box', containWith({ EnableHoverGlow: true, EnableHoverZoom: false }).indexOf('paint') === -1, containWith({ EnableHoverGlow: true }));
        check('card shadow: cards not clipped to their box', containWith({ EnableCardShadow: true, EnableHoverZoom: false }).indexOf('paint') === -1);
        check('no shadow, glow or zoom: web client clipping kept', containWith({ EnableCardShadow: false, EnableHoverZoom: false, EnableHoverGlow: false }).indexOf('paint') !== -1);
        host.remove();
    })();

    // Custom CSS copy (TV apps): the admin's own CSS is kept, and their @import lines stay first so browsers still load them.
    (() => {
        const M = T.mergeBrandingCss, S = T.BRAND_START, E = T.BRAND_END;
        const own = "/* my theme */\n@import url('https://cdn.example.com/elegantfin.css');\n.x { color: red; }\n@import \"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap\" screen;";
        const out = M(own, '.theme { color: blue; }');
        check('Custom CSS: own @import lines come before the theme', out.indexOf('elegantfin') < out.indexOf(S) && out.indexOf('family=Inter:wght@400;700') < out.indexOf(S), out);
        check('Custom CSS: own rules and comments kept after the theme', out.indexOf('.x { color: red; }') > out.indexOf(E) && out.indexOf('/* my theme */') > out.indexOf(E));
        check('Custom CSS: nothing but the @imports before the theme', out.slice(0, out.indexOf(S)) === "@import url('https://cdn.example.com/elegantfin.css');\n@import \"https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap\" screen;\n\n", JSON.stringify(out.slice(0, out.indexOf(S))));
        check('Custom CSS: saving again changes nothing', M(out, '.theme { color: blue; }') === out);
        const again = M(out, '.theme { color: green; }');
        check('Custom CSS: a new save replaces the block, not adds one', again.split(S).length === 2 && again.indexOf('color: blue') === -1 && again.indexOf('color: green') !== -1);
        const commented = M('/* @import url(old.css); */\n.y { top: 0; }', '.t {}');
        check('Custom CSS: an @import inside a comment stays in the comment', commented.indexOf('/* @import url(old.css); */') > commented.indexOf(E));
        check('Custom CSS: old manual style.css import removed', M("@import url('/ThemeBuilder/style.css');\n.z {}", '.t {}').indexOf('/ThemeBuilder/style.css') === -1);
        const stray = M(E + '\n.a {}\n' + S + '\n.old {}\n' + E, '.t {}');
        check('Custom CSS: a stray end marker before the block doesn\'t duplicate it', stray.split(S).length === 2 && stray.indexOf('.old {}') === -1, stray);
    })();

    // Typed-in URLs and font names can't break their rule.
    (() => {
        const rulesOf = (o) => { const sh = new CSSStyleSheet(); sh.replaceSync(T.buildCss(Object.assign(T.defaultValues(), o)).replace(/@import[^\n]*\n/g, '')); return [...sh.cssRules].map(r => r.cssText).join('\n'); };
        check('login logo URL with a quote keeps its rule', rulesOf({ LoginLogoUrl: "https://example.com/it's.png" }).indexOf('padded-bottom-page::before') !== -1);
        check('header logo URL with a quote keeps its rule', rulesOf({ HeaderLogoUrl: "https://example.com/o'brien.png" }).indexOf('pageTitleWithDefaultLogo') !== -1);
        check('login background URL with a quote keeps its rule', rulesOf({ LoginBackgroundUrl: "https://example.com/a'b.jpg" }).indexOf('#loginPage') !== -1);
        const fontCss = T.buildCss(Object.assign(T.defaultValues(), { CustomFontFamily: 'Noto Sans & Co' }));
        check('font name is URL-encoded in the Google Fonts link', fontCss.indexOf('family=Noto+Sans+%26+Co:') !== -1, fontCss.split('\n')[0]);
    })();

    // Card buttons: the played tick and favourite heart keep their own colours over the general icon colour.
    (() => {
        const st = document.createElement('style');
        st.textContent = T.buildCss(Object.assign(T.defaultValues(), { CardButtonColor: '#ffffff', CardButtonPlayedColor: '#00ff00', CardButtonFavoriteColor: '#ff0000' }));
        const host = document.createElement('div');
        host.innerHTML = '<div class="card"><div class="cardOverlayContainer"><button class="cardOverlayButton"><span class="material-icons cardOverlayButtonIcon check playstatebutton-icon-played"></span></button>'
            + '<button class="cardOverlayButton"><span class="material-icons cardOverlayButtonIcon favorite ratingbutton-icon-withrating"></span></button>'
            + '<button class="cardOverlayButton"><span class="material-icons cardOverlayButtonIcon more_vert"></span></button></div></div>';
        document.head.appendChild(st); document.body.appendChild(host);
        const [played, fav, more] = [...host.querySelectorAll('.material-icons')].map(i => getComputedStyle(i).color);
        check('card button: played tick uses its own colour', played === 'rgb(0, 255, 0)', played);
        check('card button: favourite heart uses its own colour', fav === 'rgb(255, 0, 0)', fav);
        check('card button: other icons use the icon colour', more === 'rgb(255, 255, 255)', more);
        st.remove(); host.remove();
    })();

    // Badge text: automatic picks black on a light badge; turned off, the chosen colour is used.
    (() => {
        const host = document.createElement('div');
        host.innerHTML = '<div class="playedIndicator"><span class="material-icons check"></span></div>';
        document.body.appendChild(host);
        const colourWith = (o) => { const st = document.createElement('style'); st.textContent = T.buildCss(Object.assign(T.defaultValues(), { AccentColor: '#f5f5f7' }, o)); document.head.appendChild(st);
            const c = getComputedStyle(host.querySelector('.material-icons')).color; st.remove(); return c; };
        check('badge text automatic: black on a light badge', colourWith({ AutoBadgeText: true }) === 'rgb(0, 0, 0)', colourWith({ AutoBadgeText: true }));
        check('badge text manual: uses the chosen colour', colourWith({ AutoBadgeText: false, BadgeTextColor: '#ff0000' }) === 'rgb(255, 0, 0)', colourWith({ AutoBadgeText: false, BadgeTextColor: '#ff0000' }));
        host.remove();
    })();

    // Watched dimming on TV (no :has()): the badge's shadow darkens the poster, clipped to it; browsers keep the filter.
    (() => {
        const st = document.createElement('style');
        st.textContent = T.buildCss(Object.assign(T.defaultValues(), { WatchedDim: '0.4' }));
        const host = document.createElement('div');

        const shown = (id) => row(id).style.display !== 'none' && row(id).closest('.tb-section').style.display !== 'none';
        const tab = (g) => document.querySelector(`.tb-group[data-group="${g}"]`).click();
        const groups = [...document.querySelectorAll('.tb-group')].map(b => b.getAttribute('data-group')).filter(Boolean);
        check('six option groups plus All', groups.length === 6 && !!document.querySelector('.tb-group[data-group=""]'), groups.join(', '));
        check('tiny sections merged into their neighbours', !T.fields.some(f => /^(Episode Lists|User Themes|Library Pages|Text & Scrollbars)$/.test(f.section || '')) && T.fields.filter(f => f.section).every(s => s.group));
        tab('Posters');
        const visibleGroups = [...new Set([...document.querySelectorAll('.tb-section')].filter(s => s.style.display !== 'none').map(s => s.getAttribute('data-group')))];
        check('a group tab shows only its sections', visibleGroups.length === 1 && visibleGroups[0] === 'Posters', visibleGroups.join(', '));
        $('tb_search').value = 'subtitle'; fire($('tb_search'));
        check('search looks across every group, whatever the tab', shown('SubtitleScale'));
        $('tb_search').value = ''; fire($('tb_search'));
        tab('');

        // Essentials: a non-essential option at its default is out of the way; changed, it shows; "Show all" shows the rest.
        const ess = $('tb_essentials_btn');
        if (!/Show all/.test(ess.textContent)) ess.click();
        setVal('HeaderButtonPadding', '0'); setVal('HomeRowSpacing', '2');
        check('Essentials view hides untouched advanced options', !shown('HeaderButtonPadding') && shown('AccentColor') && /Show all options \(\d+ more\)/.test(ess.textContent), ess.textContent);
        check('a changed option always shows, even if not an essential', shown('HomeRowSpacing'));
        ess.click();
        check('"Show all options" shows everything', shown('HeaderButtonPadding') && /essentials/.test(ess.textContent));
        ess.click();
        setVal('HomeRowSpacing', '0');

        // Dependants: indented under their option, folded away while its checkbox doesn't let them work.
        setVal('EnableHoverGlow', false);
        check('dependants are indented under their option', row('GlowSize').classList.contains('tb-child') && row('GlassOpacity').classList.contains('tb-child') && !row('EnableHoverGlow').classList.contains('tb-child'));
        check('a dependant folds away while its checkbox is off', !shown('GlowSize'));
        setVal('EnableHoverGlow', true);
        check('and unfolds when it is ticked (shown with its parent, even in Essentials)', shown('GlowSize'));
        setVal('HideCardTitles', true);
        check('options under a "Hide" fold away while it is ticked', !shown('CardTitlePosition'));
        setVal('HideCardTitles', false);
        $('tb_search').value = 'glow size'; setVal('EnableHoverGlow', false); fire($('tb_search'));
        check('search still finds a folded option (greyed, with its hint)', shown('GlowSize') && row('GlowSize').classList.contains('tb-inactive'));
        $('tb_search').value = ''; fire($('tb_search'));

        // "Hide on this page" lists.
        check('plain Hide options sit in the section\'s Hide list', !!row('HideGenres').closest('.tb-hide-list') && !!row('HideTrailerBtn').closest('.tb-hide-list') && row('HideGenres').closest('.tb-section') === row('HideTagline').closest('.tb-section'));
        check('a Hide that other options depend on stays in the main list', !row('HideCardTitles').closest('.tb-hide-list') && !row('HideDetailPoster').closest('.tb-hide-list'));
        check('Hide list entries drop the repeated "Hide"', /^Genres/.test(row('HideGenres').textContent.trim()), row('HideGenres').textContent.trim());

        // Search words and US spellings.
        const finds = (q, id) => { $('tb_search').value = q; fire($('tb_search')); const ok = shown(id); $('tb_search').value = ''; fire($('tb_search')); return ok; };
        check('search understands everyday words', finds('rounded', 'BorderRadius') && finds('wallpaper', 'AppBackgroundUrl') && finds('captions', 'SubtitleStyle') && finds('avatar', 'AccentProfileIcon'));
        check('search accepts US spellings', finds('accent color', 'AccentColor') && finds('center', 'TopBarLayout') && finds('favorite', 'HideLikeDislike'));

        // A picked option is revealed even when it's in another tab or outside Essentials.
        tab('Look');
        T.revealField('HeaderTabPadding');
        check('revealing an option switches to its tab and shows it', shown('HeaderTabPadding') && document.querySelector('.tb-group.tb-active').getAttribute('data-group') === 'Navigation');
        tab('');
    })();

    // Unsaved-changes guard.
    $('tb_close_btn').click();
    check('closing with unsaved changes asks first', $('tb_confirm').style.display === 'flex');
    $('tb_confirm_discard').click();
    check('discard closes and drops the live preview', $('tb-live-panel').style.transform !== 'none' && !$('tb-live-styles'));

    log('RESULT: ' + passed + ' passed, ' + failed + ' failed');
})().catch(e => { failed++; log('FAIL test run crashed: ' + e.message + '\n' + e.stack); log('RESULT: ' + passed + ' passed, ' + failed + ' failed'); });
</script>
</body></html>
